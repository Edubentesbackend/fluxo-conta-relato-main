services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxo-conta-relato-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxo_conta_relato
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo_conta_relato"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
